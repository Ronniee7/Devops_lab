
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: devops-lab-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - devops-network

  db:
    image: postgres:17-alpine

    container_name: devops-lab-db

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

    networks:
      - devops-network

volumes:
  postgres_data:

networks:
  devops-network:
    driver: bridge
