
name: DevOps Lab CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-checks:
    name: Python Quality and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Run Ruff linting
        run: ruff check .

      - name: Check code formatting
        run: ruff format --check .

      - name: Run tests with coverage
        run: |
          python -m pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=85 \
            -v

      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt

  docker-build:
    name: Docker Build and Smoke Test
    runs-on: ubuntu-latest
    needs: quality-checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: devops-lab:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start application container
        run: |
          docker run -d \
            --name devops-lab-ci \
            -p 8000:8000 \
            -e APP_ENV=testing \
            -e DEBUG=false \
            -e DB_HOST=127.0.0.1 \
            -e DB_PASSWORD=ci-placeholder \
            devops-lab:${{ github.sha }}

      - name: Smoke test application
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:8000/health/live; then
              echo "Application is responding."
              break
            fi

            if [ "$attempt" -eq 20 ]; then
              echo "Application did not become ready."
              docker logs devops-lab-ci
              exit 1
            fi

            sleep 2
          done

          curl --fail http://localhost:8000/
          curl --fail http://localhost:8000/health

      - name: Show container logs on failure
        if: failure()
        run: docker logs devops-lab-ci || true

      - name: Stop test container
        if: always()
        run: docker rm -f devops-lab-ci || true
